services:
  postgres:
    image: postgres:18
    container_name: auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: saikat
      POSTGRES_PASSWORD: saikat
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: auth-redis
    restart: unless-stopped

    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
